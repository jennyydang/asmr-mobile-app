<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny Bite</title>
<meta name="description" content="A 3D bunny ice cream you can spin around — tap it to take a bite.">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f5;
    --spinner-track: rgba(0, 0, 0, 0.1);
    --spinner-active: #444;
    --text-muted: #8a8a90;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #18181b;
      --spinner-track: rgba(255, 255, 255, 0.12);
      --spinner-active: #e4e4e7;
      --text-muted: #9a9aa2;
    }
  }

  :root[data-theme="dark"] {
    --bg: #18181b;
    --spinner-track: rgba(255, 255, 255, 0.12);
    --spinner-active: #e4e4e7;
    --text-muted: #9a9aa2;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }

  #canvas-wrap {
    position: fixed;
    inset: 0;
    cursor: grab;
    touch-action: none;
  }

  #canvas-wrap:active {
    cursor: grabbing;
  }

  #canvas-wrap canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    font: 14px system-ui, ui-sans-serif, sans-serif;
    color: var(--text-muted);
    transition: opacity 0.3s ease;
  }

  .loading .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid var(--spinner-track);
    border-top-color: var(--spinner-active);
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="canvas-wrap" role="button" tabindex="0" aria-label="Bunny ice cream, tap or press enter to take a bite">
</div>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <span>Loading…</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";

  if (typeof THREE === "undefined" || !THREE.GLTFLoader || !THREE.OrbitControls) {
    var loadingFallback = document.getElementById("loading");
    if (loadingFallback) {
      var spinnerEl = loadingFallback.querySelector(".spinner");
      var textEl = loadingFallback.querySelector("span");
      if (spinnerEl) spinnerEl.style.display = "none";
      if (textEl) textEl.textContent = "Couldn't load the 3D viewer — check your connection and reload.";
    }
    return;
  }

  var MODEL_URLS = ["models/bunny1.glb", "models/bunny2.glb", "models/bunny3.glb"];

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var wrap = document.getElementById("canvas-wrap");
  var loadingEl = document.getElementById("loading");

  // ---------- three.js scene ----------
  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
  camera.position.set(0, 0.95, 3.6);

  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  wrap.appendChild(renderer.domElement);

  // Simple three-point lighting, neutral enough to suit any background.
  var hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a3a, 0.65);
  scene.add(hemi);

  var key = new THREE.DirectionalLight(0xfff4e0, 1.15);
  key.position.set(2.2, 3.4, 2.6);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0xe0eaff, 0.4);
  fill.position.set(-2.6, 1.4, -1.8);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0xffffff, 0.3);
  rim.position.set(-0.6, 1.8, -3);
  scene.add(rim);

  // Soft contact shadow (a radial-gradient texture on a flat circle) instead of real shadow maps.
  function makeShadowTexture() {
    var size = 256;
    var c = document.createElement("canvas");
    c.width = c.height = size;
    var ctx = c.getContext("2d");
    var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, "rgba(0,0,0,0.32)");
    grad.addColorStop(0.7, "rgba(0,0,0,0.12)");
    grad.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    var tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  var shadowMaterial = new THREE.MeshBasicMaterial({
    map: makeShadowTexture(),
    transparent: true,
    depthWrite: false,
  });
  var shadowMesh = new THREE.Mesh(new THREE.CircleGeometry(0.9, 48), shadowMaterial);
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.position.y = 0.001;
  scene.add(shadowMesh);

  // ---------- controls ----------
  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 2.2;
  controls.maxDistance = 5;
  controls.minPolarAngle = Math.PI * 0.22;
  controls.maxPolarAngle = Math.PI * 0.62;
  controls.target.set(0, 0.75, 0);
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 1.1;
  controls.update();

  function resize() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- model loading ----------
  var loader = new THREE.GLTFLoader();
  var stageGroup = new THREE.Group();
  scene.add(stageGroup);

  var current = null; // currently displayed Object3D, or null once fully eaten

  // These three bite-stage models are independent Tripo AI generations, not
  // three edits of one shared mesh — each one gets auto-normalized to its
  // own canonical bounding box on export, so all three report almost the
  // exact same overall height even though the actual cone underneath is a
  // different real width in each (stage 3's cone measures ~65% wider per
  // unit of height than stage 1's, verified by fitting the cone's taper).
  // Scaling every stage to the same bounding-box height therefore makes the
  // untouched cone visibly balloon and shrink between bites. These
  // corrections were measured directly against each model's actual cone
  // taper (radius vs. height, sampled just above the tip, well below where
  // the scoop starts) so the part that's supposed to stay put actually does.
  var STAGE_SCALE_CORRECTION = [1, 0.905, 0.607];

  function computeScale(root) {
    var box = new THREE.Box3().setFromObject(root);
    var size = new THREE.Vector3();
    box.getSize(size);
    var maxDim = Math.max(size.x, size.y, size.z) || 1;
    return 1.7 / maxDim;
  }

  function frameModel(root, scale) {
    root.scale.setScalar(scale);

    var box = new THREE.Box3().setFromObject(root);
    var center = new THREE.Vector3();
    box.getCenter(center);
    var minY = box.min.y;
    root.position.x -= center.x;
    root.position.z -= center.z;
    root.position.y -= minY;

    root.traverse(function (node) {
      if (node.isMesh) {
        node.castShadow = false;
        node.receiveShadow = false;
        if (node.material) {
          node.material.envMapIntensity = 1.0;
        }
      }
    });

    return root;
  }

  function loadModel(url) {
    return new Promise(function (resolve, reject) {
      loader.load(
        url,
        function (gltf) {
          resolve(gltf.scene);
        },
        undefined,
        reject
      );
    });
  }

  function showModel(obj) {
    if (current) stageGroup.remove(current);
    current = obj;
    stageGroup.add(obj);
  }

  var stages = []; // framed Object3D per bite stage, index 0..2
  var stage = 0;   // 0 = whole, 1 = bitten once, 2 = bitten twice, 3 = fully eaten
  var busy = false;

  Promise.all(MODEL_URLS.map(loadModel))
    .then(function (models) {
      var baseScale = computeScale(models[0]);
      stages = models.map(function (m, i) {
        return frameModel(m, baseScale * STAGE_SCALE_CORRECTION[i]);
      });
      showModel(stages[0]);
      loadingEl.classList.add("hidden");
    })
    .catch(function (err) {
      loadingEl.querySelector("span").textContent = "Couldn't load the 3D model — please reload the page.";
      loadingEl.querySelector(".spinner").style.display = "none";
      console.error(err);
    });

  // ---------- munch sound (synthesized, no audio file needed) ----------
  var audioCtx = null;
  function playMunch() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var now = audioCtx.currentTime;
      var bites = 2;
      for (var i = 0; i < bites; i++) {
        var t0 = now + i * 0.115;
        var dur = 0.1;
        var bufferSize = Math.floor(audioCtx.sampleRate * dur);
        var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        var data = buffer.getChannelData(0);
        for (var j = 0; j < bufferSize; j++) {
          var env = Math.pow(1 - j / bufferSize, 2.2);
          data[j] = (Math.random() * 2 - 1) * env;
        }
        var noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        var bandpass = audioCtx.createBiquadFilter();
        bandpass.type = "bandpass";
        bandpass.frequency.value = 850 + Math.random() * 600;
        bandpass.Q.value = 0.8;

        var gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.85, t0 + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

        noise.connect(bandpass);
        bandpass.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(t0);
        noise.stop(t0 + dur + 0.02);
      }
    } catch (e) {
      console.error("munch sound failed", e);
    }
  }

  // ---------- bite interaction ----------
  var raycaster = new THREE.Raycaster();
  var pointer = new THREE.Vector2();
  var downPos = null;
  var downTime = 0;

  function setPointer(clientX, clientY) {
    pointer.x = (clientX / window.innerWidth) * 2 - 1;
    pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  }

  function hitsModel(clientX, clientY) {
    if (!current) return false;
    setPointer(clientX, clientY);
    raycaster.setFromCamera(pointer, camera);
    var hits = raycaster.intersectObject(current, true);
    return hits.length > 0;
  }

  function squashBounce(obj, onDone) {
    if (reduceMotion) {
      if (onDone) onDone();
      return;
    }
    var start = performance.now();
    var duration = 260;
    var baseScale = obj.scale.x;
    function step(now) {
      var t = Math.min(1, (now - start) / duration);
      var s;
      if (t < 0.35) {
        s = baseScale * (1 - 0.22 * (t / 0.35));
      } else {
        var t2 = (t - 0.35) / 0.65;
        var bounce = Math.sin(t2 * Math.PI) * 0.09;
        s = baseScale * (0.78 + 0.22 * t2 + bounce);
      }
      obj.scale.setScalar(s);
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        obj.scale.setScalar(baseScale);
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(step);
  }

  // The final bite has nothing to swap to — the model just shrinks away
  // (toward its own base, since these models are authored with their local
  // origin at the floor-contact point) while the contact shadow fades with it.
  function eatAway(obj, onDone) {
    if (reduceMotion) {
      stageGroup.remove(obj);
      shadowMesh.visible = false;
      if (onDone) onDone();
      return;
    }
    var start = performance.now();
    var duration = 420;
    var baseScale = obj.scale.x;
    function step(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = t * t * t;
      obj.scale.setScalar(Math.max(baseScale * (1 - eased), 0.0001));
      shadowMaterial.opacity = 1 - eased;
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        stageGroup.remove(obj);
        shadowMesh.visible = false;
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(step);
  }

  function bite() {
    if (busy || stage >= 3 || stages.length < 3) return;
    busy = true;
    playMunch();

    if (stage === 0) {
      squashBounce(current, function () {
        showModel(stages[1]);
        stage = 1;
        busy = false;
      });
    } else if (stage === 1) {
      squashBounce(current, function () {
        showModel(stages[2]);
        stage = 2;
        busy = false;
      });
    } else if (stage === 2) {
      eatAway(current, function () {
        current = null;
        stage = 3;
        busy = false;
      });
    }
  }

  // Pointer Events unify mouse/touch/pen in one event stream — using only
  // this (rather than separate mouse + touch listeners) avoids double-firing
  // bite() from a touch's synthetic compatibility mouse event.
  function onPointerDown(e) {
    downPos = { x: e.clientX, y: e.clientY };
    downTime = performance.now();
  }

  function onPointerUp(e) {
    if (!downPos) return;
    var dx = e.clientX - downPos.x;
    var dy = e.clientY - downPos.y;
    var moved = Math.sqrt(dx * dx + dy * dy);
    var elapsed = performance.now() - downTime;
    downPos = null;
    if (moved < 6 && elapsed < 500 && hitsModel(e.clientX, e.clientY)) {
      bite();
    }
  }

  wrap.addEventListener("pointerdown", onPointerDown);
  wrap.addEventListener("pointerup", onPointerUp);
  wrap.addEventListener("pointercancel", function () {
    downPos = null;
  });
  wrap.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      bite();
    }
  });

  // ---------- render loop ----------
  function animate() {
    requestAnimationFrame(animate);
    controls.update(); // also advances autoRotate
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
